ラズパイでのB3Mサーボ制御環境構築ガイド
（Windows直結・ヘッドレス構成・VS Code使用）

1. 構成概要
PC: Windows 10/11

Raspberry Pi: OS Lite (Bookworm以降推奨・画面なし)

接続: PCとラズパイをUSB有線LANアダプタで直結 (BUFFALO LUA5-U3-AGTE等)

開発: VS Code (Remote - SSH)

制御: 近藤科学 B3Mサーボ (USBシリアル変換アダプタ使用)

2. ネットワーク接続とインターネット共有
PCとラズパイをLANケーブルで直結し、PCのWi-Fiをラズパイにも分け与える構成です。

物理接続: PC(USB) ⇔ LANアダプタ ⇔ ラズパイ

SSH接続:

PowerShell

ssh pi@raspberrypi.local
インターネット共有設定 (Windows):

Win + R で「ファイル名を指定して実行」を開き、ncpa.cpl と入力。

Wi-Fiのプロパティ > 「共有」タブ > 「ネットワークのほかのユーザーに…接続を許可する」にチェック。

ホームネットワーク接続先に、USB LANアダプタを選択。

【重要トラブルシューティング】通信が不安定な場合
apt install などでタイムアウトする場合、Windows共有特有のパケットサイズ問題（MTU）が原因です。ラズパイ側で以下を実行します。

Bash

sudo ip link set dev eth0 mtu 1400
3. 開発環境のセットアップ (VS Code)
ラズパイの中で直接コードを書くのではなく、PCのVS Codeから遠隔編集します。

VS Code拡張機能 「Remote - SSH」 をインストール。

左下の >< マークから Connect to Host... を選択。

ssh pi@raspberrypi.local で接続。

4. GitとPython環境の構築
最新OS (Bookworm) ではシステムへの直接インストールが禁止されているため、仮想環境 (venv) が必須です。

ツールのインストール:

Bash

sudo apt update
sudo apt install git gh -y
GitHub認証:

Bash

gh auth login
# SSH接続を選択し、ブラウザ認証を行う
リポジトリのクローン:

Bash

gh repo clone <ユーザー名>/<リポジトリ名>
cd <リポジトリ名>
仮想環境の作成と有効化 (必須):

Bash

python3 -m venv venv       # 仮想環境作成
source venv/bin/activate   # 有効化（(venv)と表示されればOK）
pip install -r requirements.txt  # ライブラリインストール
5. モータードライバの認識 (近藤科学アダプタ)
近藤科学のUSBアダプタは、標準では /dev/ttyUSB0 として認識されない場合があります。

認識確認:

Bash

lsusb
# ID 165c:0009 Kondo Kagaku... が表示されるか確認
ドライバの手動割り当て: 認識されない場合、以下を実行してカーネルに認識させます。

Bash

sudo modprobe ftdi_sio
echo 165c 0009 | sudo tee /sys/bus/usb-serial/drivers/ftdi_sio/new_id
権限の付与:

Bash

sudo usermod -aG dialout $USER
# ※設定後、一度ログアウト・再接続が必要
確認:

Bash

ls /dev/ttyUSB*
# /dev/ttyUSB0 が表示されれば成功
作業開始時のチェックリスト (コピペ用)
一度環境を作った後、再起動後に作業を再開するためのコマンド集です。

Bash

# 1. ログイン
ssh pi@raspberrypi.local

# 2. ドライバのおまじない (再起動ごとにリセットされる場合があるため)
sudo modprobe ftdi_sio
echo 165c 0009 | sudo tee /sys/bus/usb-serial/drivers/ftdi_sio/new_id

# 3. プロジェクトへ移動＆仮想環境IN
cd <プロジェクトフォルダ>
source venv/bin/activate

# 4. 実行
python main.py